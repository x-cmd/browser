id: x-b-4-safari

data:
  - name:
      en: overview
      cn: 概览
    qa:
      - id: what-is-safari
        question:
          en: What is Safari?
          cn: 什么是 Safari？
        answer:
          en: Apple's web browser built on the WebKit rendering engine. Bundled with macOS, iOS, and iPadOS. Tightly integrated with the OS for battery life, Apple Intelligence, and Apple's privacy framework.
          cn: Apple 的网页浏览器，基于 WebKit 渲染引擎。随 macOS、iOS、iPadOS 自带。与 OS 深度集成以提供电池续航、Apple Intelligence 与 Apple 隐私框架。
        confidence: 9
        reference:
          - docs/4-safari.en.md
          - docs/4-safari.cn.md

      - id: webkit-monoculture
        question:
          en: Why does Safari use WebKit instead of its own engine?
          cn: 为什么 Safari 用 WebKit 而不是自己的引擎？
        answer:
          en: Apple develops WebKit itself — it's not third-party. Apple forked WebKit from KHTML in 2001, then developed it in-house for Safari. Every iOS browser also uses WebKit due to Apple's policy.
          cn: Apple 自己开发 WebKit——不是第三方。Apple 于 2001 年从 KHTML fork WebKit，然后内部为 Safari 开发。每个 iOS 浏览器也由于 Apple 政策而使用 WebKit。
        confidence: 9
        reference:
          - docs/4-safari.en.md

  - name:
      en: install
      cn: 安装
    qa:
      - id: how-to-install
        question:
          en: How do I install Safari?
          cn: 如何安装 Safari？
        answer:
          en: Safari is bundled with macOS, iOS, and iPadOS. Update via System Settings → Software Update (macOS) or Settings → General → Software Update (iOS / iPadOS).
          cn: Safari 随 macOS、iOS、iPadOS 自带。通过系统设置 → 软件更新（macOS）或设置 → 通用 → 软件更新（iOS / iPadOS）升级。
        confidence: 9
        reference:
          - docs/4-safari.en.md

      - id: macos-13-required
        question:
          en: What's the minimum macOS for Safari 19?
          cn: Safari 19 最低要求什么 macOS？
        answer:
          en: macOS 13 Ventura. Older macOS versions stay on Safari 16 (Sep 2022).
          cn: macOS 13 Ventura。更老 macOS 留在 Safari 16（2022 年 9 月）。
        confidence: 9
        reference:
          - docs/4-safari.en.md

      - id: safari-on-windows
        question:
          en: Can I use Safari on Windows or Linux?
          cn: 我能在 Windows 或 Linux 上用 Safari 吗？
        answer:
          en: No — Safari is macOS / iOS / iPadOS only. Windows support was discontinued in 2012. Use Chrome / Firefox / Brave on Windows or Linux.
          cn: 不能 —— Safari 仅 macOS / iOS / iPadOS。Windows 支持于 2012 年停止。在 Windows 或 Linux 上用 Chrome / Firefox / Brave。
        confidence: 9
        reference:
          - docs/4-safari.en.md

  - name:
      en: features
      cn: 功能
    qa:
      - id: apple-intelligence
        question:
          en: What is Apple Intelligence in Safari?
          cn: Safari 中的 Apple Intelligence 是什么？
        answer:
          en: On-device AI features integrated with Safari — summarize, rewrite, image generation. Requires Apple silicon (M1+) and a recent macOS / iOS.
          cn: 与 Safari 集成的端侧 AI 功能——摘要、改写、图像生成。要求 Apple silicon（M1+）与较新 macOS / iOS。
        confidence: 9
        reference:
          - docs/4-safari.en.md

      - id: itp
        question:
          en: What is Intelligent Tracking Prevention (ITP)?
          cn: 什么是智能跟踪防护（ITP）？
        answer:
          en: Safari's machine-learning-driven tracker blocking. Block cross-site tracking, fingerprint scripts, and known tracking domains. On by default.
          cn: Safari 基于机器学习的跟踪器阻止。阻止跨站跟踪、指纹脚本、已知跟踪域。默认开启。
        confidence: 9
        reference:
          - docs/4-safari.en.md

      - id: webgpu
        question:
          en: Does Safari support WebGPU?
          cn: Safari 支持 WebGPU 吗？
        answer:
          en: Yes — WebGPU enabled by default in Safari 19 (Jun 2026). The last major browser engine to ship WebGPU stable.
          cn: 支持 —— Safari 19（2026 年 6 月）起默认启用 WebGPU。最后一个发布稳定 WebGPU 的主流浏览器引擎。
        confidence: 9
        reference:
          - docs/4-safari.en.md

      - id: hide-my-email
        question:
          en: What is Hide My Email?
          cn: 什么是隐藏我的邮件？
        answer:
          en: A Safari / iCloud feature that creates random email aliases for sign-ups. Forwarded to your real inbox. Requires iCloud+ subscription.
          cn: Safari / iCloud 功能，为注册创建随机邮件别名。转发到你的真实收件箱。需要 iCloud+ 订阅。
        confidence: 9
        reference:
          - docs/4-safari.en.md

  - name:
      en: extensions
      cn: 扩展
    qa:
      - id: manifest-v3
        question:
          en: Does Safari support Manifest V3?
          cn: Safari 支持 Manifest V3 吗？
        answer:
          en: Yes — Safari Web Extensions supports Manifest V3 since Safari 16 (Sep 2022). Chrome extensions translate via the same JSON manifest format.
          cn: 支持 —— Safari Web 扩展自 Safari 16（2022 年 9 月）起支持 Manifest V3。Chrome 扩展通过同一 JSON manifest 格式迁移。
        confidence: 9
        reference:
          - docs/4-safari.en.md

  - name:
      en: concepts
      cn: 概念
    qa:
      - id: what-is-webkit
        question:
          en: What is WebKit?
          cn: 什么是 WebKit？
        answer:
          en: Apple's layout engine. Open-source. Powers Safari, plus every browser on iOS / iPadOS due to Apple's policy.
          cn: Apple 的排版引擎。开源。支撑 Safari，加上 iOS / iPadOS 上的每个浏览器（Apple 政策）。
        confidence: 9
        reference:
          - docs/4-safari.en.md

      - id: what-is-jsc
        question:
          en: What is JavaScriptCore?
          cn: 什么是 JavaScriptCore？
        answer:
          en: Apple's JavaScript engine. Tiered JIT with bytecode interpreter, four-tier optimizing compiler. Supports WebAssembly and WebGPU.
          cn: Apple 的 JavaScript 引擎。带字节码解释器的分层 JIT，四层优化编译器。支持 WebAssembly 与 WebGPU。
        confidence: 9
        reference:
          - docs/4-safari.en.md